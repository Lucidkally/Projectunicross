<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNICROSS</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#14213d;--mut:#5b6784;--line:#d5dbe8;--acc:#1670b3;--ai:#fff;--ok:#12703a;--okb:#dff3e6;--wn:#8a5300;--wnb:#fdf0d3;--bd:#b3261e;--bdb:#fbe3e1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1526;--card:#182038;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2b3556;--acc:#6cb6ee;--ai:#0f1526;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}}
:root[data-theme="dark"]{--bg:#0f1526;--card:#182038;--ink:#e8ecf7;--mut:#9aa6c4;--line:#2b3556;--acc:#6cb6ee;--ai:#0f1526;--ok:#6fd49a;--okb:#123a25;--wn:#f0b752;--wnb:#3d2d0c;--bd:#ff8f86;--bdb:#4a1a17}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;margin:0 0 8px;font-weight:600}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font:600 20px Georgia,serif;display:flex;align-items:center;gap:8px}
.chain{display:inline-flex}.chain i{width:10px;height:14px;border:2px solid var(--acc);border-radius:3px;margin-right:-3px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.sc{overflow-x:auto}
label{display:block;font-weight:600;margin:10px 0 4px}
input,select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
button{font:inherit;padding:8px 13px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--acc);color:var(--ai);border-color:var(--acc);font-weight:600;margin-top:12px}
button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
button.s{padding:4px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.b{padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.Pending,.Returned,.Amended,.NotFound{background:var(--wnb);color:var(--wn)}
.Compiled,.Approved,.Authentic{background:var(--okb);color:var(--ok)}
.Altered{background:var(--bdb);color:var(--bd)}
code,.h{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;word-break:break-all}
.verdict{border-radius:10px;padding:14px;margin-bottom:12px;font:600 20px Georgia,serif}
.verdict.Authentic{background:var(--okb);color:var(--ok)}.verdict.Altered{background:var(--bdb);color:var(--bd)}.verdict.NotFound{background:var(--wnb);color:var(--wn)}
.hs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hs div{border:1px solid var(--line);border-radius:8px;padding:10px}
.blocks{display:flex;gap:0;overflow-x:auto;padding-bottom:6px}
.blk{flex:0 0 150px;border:2px solid var(--acc);border-radius:8px;padding:8px;margin-right:18px;position:relative;background:var(--card)}
.blk:not(:last-child):after{content:"";position:absolute;right:-20px;top:50%;width:18px;border-top:3px solid var(--acc)}
.blk.bad{border-color:var(--bd)}
.msg{padding:8px 12px;border-radius:6px;background:var(--wnb);color:var(--wn);margin-bottom:12px}
.chips button{margin:4px 4px 0 0}
@media print{header,.noprint,button{display:none!important}body,.card{background:#fff!important;color:#000!important}.card{border:0;padding:0}}
.brand img{width:36px;height:36px;border-radius:50%}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px;border-radius:10px;font-size:16px;background:var(--card)}.tile:hover{border-color:var(--acc)}.q{margin:10px 0 14px}.slip{display:flex;gap:12px;align-items:center;margin-bottom:12px}.slip img{width:54px;height:54px;border-radius:50%}

:root{--bg:#eef1fb;--acc:#1747c9;--line:#d3daf0;--hd:#0f2a80;--sh:0 14px 40px rgba(23,71,201,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1024;--acc:#7fa6ff;--line:#2a3563;--hd:#070b1d;--sh:0 14px 40px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#0b1024;--acc:#7fa6ff;--line:#2a3563;--hd:#070b1d;--sh:0 14px 40px rgba(0,0,0,.5)}
body{font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;background:var(--bg)}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;font-weight:800;letter-spacing:-.02em}
h1{font-size:34px}h2{font-size:26px}
header{background:var(--hd);border:0;color:#fff;padding:14px 18px}
.brand{font:800 22px Montserrat,sans-serif;color:#fff;letter-spacing:.03em}
.brand img{width:42px;height:42px;border:2px solid #fff;background:#fff}
header nav button{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:999px;font-weight:600}
header nav button.on{background:#fff;color:var(--hd);border-color:#fff}
header .mut{color:#c9d6ff;font-size:13px}
.card{border:0;border-radius:20px;box-shadow:var(--sh);padding:24px}
input,select{border:1.5px solid var(--line);border-radius:12px;padding:14px;font:inherit;background:var(--card)}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
label{font-weight:700;font-size:14px}
button{border-radius:12px;font-weight:700;border:1.5px solid var(--line)}
button.p{width:100%;padding:15px;font-size:17px;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
button.s{border-radius:999px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:800}
.tiles{gap:16px}.tile{border:0;border-radius:20px;box-shadow:var(--sh);padding:22px;font-family:inherit}
.tile b{font-size:18px;font-weight:800}.tile .ic{font-size:32px;margin-bottom:6px}
.tile.hot{background:var(--acc);color:var(--ai)}.tile.hot .mut{color:inherit;opacity:.85}
.auth{max-width:440px;margin:20px auto}.auth .card{padding:30px}.auth h2{text-align:center;font-size:30px;margin-bottom:18px}
.auth input{margin-bottom:12px}.auth .logo{display:block;margin:0 auto 16px;width:84px;height:84px;border-radius:50%}
.ck{display:flex;gap:10px;align-items:center;font-weight:600;margin:2px 0 6px}.ck input{width:auto;margin:0}
.hero{text-align:center;padding:34px 20px;background:linear-gradient(135deg,var(--hd),#1c63e6);color:#fff;border-radius:24px;margin-bottom:18px;box-shadow:var(--sh)}
.hero h1{color:#fff;font-size:42px;margin:10px 0 6px}.hero p{color:#e3ebff;margin:0;max-width:420px;margin-inline:auto}
.hero img{width:92px;height:92px;border-radius:50%;background:#fff;border:3px solid #fff}
.b{font-weight:800}.verdict{border-radius:16px;font:800 22px Montserrat,sans-serif;padding:18px}
.ctr{text-align:center}
</style></head><body>

<script>
const $=s=>document.querySelector(s),enc=new TextEncoder();
async function sha(t){const b=await crypto.subtle.digest('SHA-256',enc.encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO=$('#lg').src;document.head.insertAdjacentHTML('beforeend','<link rel="icon" href="'+LOGO+'">');
const SESSION='2025/2026',FEE=50000;
const gradeOf=s=>s>=70?'A':s>=60?'B':s>=50?'C':s>=45?'D':s>=40?'E':'F';
const short=h=>h.slice(0,10)+'…'+h.slice(-6);
const recData=r=>[r.studentId,r.courseId,r.score,r.grade,r.session,r.semester,r.ts].join('|');
const certData=c=>'CERT|'+c.studentId+'|'+c.date;
let DB,me=null,view='home',tab='',vres=null,msg='',chainMsg='',editId=null;
const stu=id=>DB.students.find(s=>s.id==id),crs=id=>DB.courses.find(c=>c.id==id);
const save=()=>{try{localStorage.setItem('lw4',JSON.stringify(DB))}catch(e){}};
async function mine(data,prev){let n=0,h;while(!(h=await sha(data+prev+n)).startsWith('00'))n++;return{nonce:n,hash:h}}
async function addBlock(data){const prev=DB.blocks[DB.blocks.length-1].hash,m=await mine(data,prev);const b={id:DB.blocks.length+1,prev,ts:new Date().toISOString().slice(0,19).replace('T',' '),data,...m};DB.blocks.push(b);return b}
async function commit(r,by){r.status='Approved';r.approvedBy=by;const b=await addBlock(recData(r));r.hash=b.hash;r.blockId=b.id;r.status='Compiled'}
async function seed(){
 const pw=await sha('demo123');
 DB={users:[['lecturer','Lecturer','Dr. A. Okon'],['hod','HOD','Prof. E. Bassey'],['records','RecordsUnit','Mrs. I. Effiong'],['admin','Admin','System Admin']].map((u,i)=>({id:i+1,username:u[0],pw,role:u[1],name:u[2]})),
 students:[['24/CSC/005','Andy Edet'],['24/CSC/012','Grace Ita'],['24/CSC/019','Ubong Ekpo'],['24/CSC/027','Blessing Etim']].map((s,i)=>({id:i+1,matric:s[0],name:s[1],dept:'Computer Science',level:'400',pw})),
 courses:[['CSC401','Software Engineering',3],['CSC405','Cybersecurity',3],['CSC409','Distributed Systems',3],['CSC411','Database Systems',2],['CSC413','Computer Networks',3],['CSC415','Artificial Intelligence',3],['CSC417','Operating Systems II',3],['CSC419','Compiler Construction',2],['CSC421','Human-Computer Interaction',2],['CSC423','Blockchain Technology',3],['CSC499','Final Year Project',6]].map((c,i)=>({id:i+1,code:c[0],title:c[1],units:c[2]})),
 results:[],certs:[],log:[],blocks:[],audit:[],payments:[1,2,3].map(i=>({id:i,studentId:i,session:SESSION,amount:FEE,ref:'RCT-00'+i,at:'2026-08-20 09:00'})),regs:[[1,2],[2,1],[3,3]].map((x,i)=>({id:i+1,studentId:x[0],courseId:x[1],session:SESSION}))};
 const g=await mine('Genesis','0'.repeat(64));DB.blocks.push({id:1,prev:'0'.repeat(64),ts:'2026-01-01 00:00:00',data:'Genesis',...g});
 for(const [s,c,sc] of [[1,2,78],[2,1,64]]){const r={id:DB.results.length+1,studentId:s,courseId:c,score:sc,grade:gradeOf(sc),session:'2025/2026',semester:'First',ts:'2026-09-01 10:00',status:'Pending'};DB.results.push(r);await commit(r,2)}
 {const r={id:3,studentId:1,courseId:4,score:32,grade:'F',session:'2024/2025',semester:'Second',ts:'2025-09-01 10:00',status:'Pending'};DB.results.push(r);await commit(r,2)}
 DB.results.push({id:4,studentId:3,courseId:3,score:55,grade:'C',session:'2025/2026',semester:'First',ts:'2026-09-02 11:30',status:'Pending'});save()}
async function init(){try{const s=localStorage.getItem('lw4');if(s)DB=JSON.parse(s)}catch(e){}if(!DB)await seed();DB.audit=DB.audit||[];render()}
function render(){
 const nav=me?`<span class="mut">${esc(me.name)} (${me.role})</span><button class="${view=='dash'?'on':''}" onclick="go('dash')">Dashboard</button><button class="${view=='verify'?'on':''}" onclick="go('verify')">Verify</button><button onclick="me=null;go('home')">Log out</button>`:`<button class="${view=='home'?'on':''}" onclick="go('home')">Home</button><button class="${view=='verify'?'on':''}" onclick="go('verify')">Verify a record</button>`;
 $('#nav').innerHTML=nav;
 $('#app').innerHTML=(msg?`<div class="msg">${esc(msg)}</div>`:'')+(view=='home'?landV():view=='slogin'?loginV('Student'):view=='stf'?loginV('Staff'):view=='reg'?regV():view=='verify'?verifyV():dashV());msg='';fillCourses()}
function go(v){view=v;vres=null;if(v=='dash')tab='';render()}
const landV=()=>`<div class="hero"><img src="${LOGO}" alt=""><h1>UNICROSS</h1><p>Academic records you can trust. Results are locked on a blockchain so anyone can verify them.</p></div><div class="tiles"><button class="tile hot" onclick="go('reg')"><span class="ic">📝</span><b>Register</b><span class="mut">New student? Create your account</span></button><button class="tile" onclick="go('slogin')"><span class="ic">🎓</span><b>Student login</b><span class="mut">Fees, courses and results</span></button><button class="tile" onclick="go('stf')"><span class="ic">🧑‍🏫</span><b>Staff login</b><span class="mut">Lecturers, HOD, Records Unit, Admin</span></button><button class="tile" onclick="go('verify')"><span class="ic">✅</span><b>Verify a record</b><span class="mut">For employers, no account needed</span></button></div>`;
const IC={fees:'💳',reg:'📝',res:'📄',carry:'🔁',enter:'✏️',subs:'📋',pend:'⏳',appr:'✅',aud:'🕵️',chg:'🔄',comp:'📚',cert:'🎓',chain:'⛓️',vlog:'🔎'};
const ru=k=>{try{return localStorage.getItem('lw-ru-'+k)||''}catch(e){return ''}};
function loginV(k){k=k||'Student';return`<div class="auth"><button onclick="go('home')">← Back</button><img class="logo" src="${LOGO}" alt="" style="margin-top:14px"><div class="card"><h2>${k} Login</h2><input id="lu" aria-label="${k=='Staff'?'Username':'Registration number'}" placeholder="${k=='Staff'?'Username':'Registration number'}" value="${esc(ru(k))}" autocomplete="off" autocapitalize="off"><input id="lp" type="password" aria-label="Password" placeholder="Enter password"><label class="ck"><input id="rm" type="checkbox"> Remember me</label><button class="p" onclick="doLogin('${k}')">Login</button></div>${k=='Student'?`<p class="ctr mut">Don't have an account yet? <button class="s" onclick="go('reg')">Register</button></p>`:''}</div>`}
const regV=()=>`<div class="auth"><button onclick="go('home')">← Back</button><div class="card" style="margin-top:12px"><h2>Register</h2><label>Full name</label><input id="gn" autocomplete="off"><label>Registration number</label><input id="gm" placeholder="24/CSC/005" autocapitalize="characters" autocomplete="off"><div class="row"><div><label>Department</label><input id="gd" value="Computer Science"></div><div><label>Level</label><select id="gl">${[100,200,300,400,500].map(l=>`<option ${l==400?'selected':''}>${l}</option>`).join('')}</select></div></div><label>Password (at least 6 characters)</label><input id="gp" type="password"><label>Confirm password</label><input id="gc" type="password"><button class="p" onclick="doRegister()">Create account</button></div><p class="mut">Already registered? <button class="s" onclick="go('slogin')">Student login</button></p></div>`;
async function doRegister(){const n=$('#gn').value.trim(),m=$('#gm').value.trim().toUpperCase(),d=$('#gd').value.trim(),pw=$('#gp').value;
 if(n.length<3||m.length<3||!d){msg='Enter your full name, registration number and department.';return render()}
 if(pw.length<6){msg='Your password must be at least 6 characters.';return render()}
 if(pw!==$('#gc').value){msg='The two passwords do not match.';return render()}
 if(DB.students.some(x=>x.matric.toUpperCase()==m)){msg='That registration number is already registered. Log in instead.';return render()}
 DB.students.push({id:Math.max(...DB.students.map(x=>x.id))+1,matric:m,name:n,dept:d,level:$('#gl').value,pw:await sha(pw)});save();view='slogin';msg='Registration successful. Log in with your registration number and password.';render()}
async function doLogin(k){const un=$('#lu').value.trim();let u=k=='Staff'?DB.users.find(x=>x.username===un):null;if(k=='Student'){const st=DB.students.find(x=>x.matric.toLowerCase()===un.toLowerCase());if(st)u={id:'S'+st.id,role:'Student',name:st.name,pw:st.pw,sid:st.id}}if(!u||await sha($('#lp').value)!==u.pw){msg='Invalid login. Check your username and password.';return render()}try{$('#rm').checked?localStorage.setItem('lw-ru-'+k,un):localStorage.removeItem('lw-ru-'+k)}catch(e){}me=u;view='dash';tab='';render()}
const resTable=(rows,act)=>`<div class="sc"><table><tr><th>ID</th><th>Reg. No.</th><th>Student</th><th>Course</th><th>Score</th><th>Grade</th><th>Status</th><th>Block</th>${act?'<th></th>':''}</tr>${rows.map(r=>`<tr><td>RES-${r.id}</td><td>${stu(r.studentId).matric}</td><td>${esc(stu(r.studentId).name)}</td><td>${crs(r.courseId).code}</td><td>${r.score}${r.amend?` <span class="mut">(was ${r.amend.o.score}, ${r.amend.o.grade})</span>`:''}</td><td>${r.grade}</td><td><span class="b ${r.status}">${r.status}</span></td><td>${r.blockId||'-'}</td>${act?`<td>${act(r)}</td>`:''}</tr>`).join('')||'<tr><td colspan="9" class="mut">Nothing here yet.</td></tr>'}</table></div>`;
const T={Student:[['fees','School fees','Pay and view your receipt'],['reg','Course registration','Add or drop courses (max 9)'],['res','Results','View and print your results'],['carry','Carryover courses','Courses you still need to pass']],Lecturer:[['enter','Enter results','Grade registered courses'],['subs','Submitted results','Track your submissions']],HOD:[['pend','Pending approval','Approve or reject results'],['appr','Approved results','Change a grade'],['aud','Audit trail','Who changed what']],RecordsUnit:[['chg','Change approvals','Grade changes waiting'],['comp','Compiled results','Approved results'],['cert','Certificates','Issue and view certificates'],['aud','Audit trail','Who changed what']],Admin:[['chain','Blockchain ledger','Blocks and integrity'],['aud','Audit trail','Who changed what'],['vlog','Verification log','Who checked what']]};
const sq=()=>`<input class="q noprint" placeholder="Search by course or reg. number" oninput="filt(this.value)" aria-label="Search">`;
function filt(v){v=v.toLowerCase();document.querySelectorAll('.sec tr').forEach(tr=>{if(!tr.querySelector('th'))tr.style.display=tr.textContent.toLowerCase().includes(v)?'':'none'})}
const sec=(t,b,ns)=>`<button class="noprint" onclick="tab='';editId=null;render()">← Back to dashboard</button><h2 style="margin-top:12px">${t}</h2>${ns?'':sq()}<div class="sec">${b}</div>`;
function homeV(){return`<h2>Welcome, ${esc(me.name)}</h2><p class="mut">${me.role=='Student'?stu(me.sid).matric:me.role}. Choose a section.</p><div class="tiles">${T[me.role].map(x=>`<button class="tile" onclick="tab='${x[0]}';render()"><span class="ic">${IC[x[0]]}</span><b>${x[1]}</b><span class="mut">${x[2]}</span></button>`).join('')}</div>`}
function dashV(){if(!me)return loginV();return tab?(me.role=='Student'?studentSec():staffSec()):homeV()}
const chainV=()=>`<div class="blocks">${DB.blocks.map(b=>`<div class="blk ${chainMsg&&chainMsg.bad.includes(b.id)?'bad':''}"><b>Block ${b.id}</b><div class="mut" style="font-size:12px">${b.ts}</div><div class="h">prev ${short(b.prev)}</div><div class="h">hash ${short(b.hash)}</div><div class="mut" style="font-size:12px">nonce ${b.nonce}</div></div>`).join('')}</div>${chainMsg?`<div class="msg" style="margin-top:10px;${chainMsg.bad.length?'background:var(--bdb);color:var(--bd)':'background:var(--okb);color:var(--ok)'}">${chainMsg.t}</div>`:''}<button onclick="checkChain()">Check chain integrity</button> <button onclick="tamper()">Run tamper test</button><p class="mut">The tamper test changes a score directly in the database, with no reason, approval or audit entry. Verifying that result then shows Altered.</p>`;
const vlogV=()=>`<div class="sc"><table><tr><th>#</th><th>Reg. No.</th><th>Record</th><th>Verifier</th><th>Checked</th><th>Result</th></tr>${DB.log.map(l=>`<tr><td>${l.id}</td><td>${esc(l.reg||'-')}</td><td>${esc(l.rec)}</td><td>${esc(l.who)}</td><td>${l.at}</td><td><span class="b ${l.res}">${l.res}</span></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No verification attempts yet.</td></tr>'}</table></div>`;
function staffSec(){const R=DB.results,st=x=>R.filter(q=>q.status==x),r=me.role,f=T[r].find(x=>x[0]==tab);if(!f)return homeV();let b='',ns=0;
 if(tab=='aud')b=auditV();
 else if(r=='Lecturer')b=tab=='enter'?(ns=1,`<p class="mut">Only courses the student has registered can be graded.</p><div class="card"><div class="row"><div><label>Student</label><select id="rs" onchange="fillCourses()">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select></div><div><label>Course</label><select id="rc"></select></div><div><label>Score (0-100)</label><input id="rsc" type="number" min="0" max="100" oninput="$('#gr').textContent=this.value===''?'-':gradeOf(+this.value)"></div><div><label>Grade (auto)</label><div id="gr" style="padding:9px 0;font-weight:700">-</div></div><div><label>Session</label><input id="rse" value="${SESSION}" readonly></div><div><label>Semester</label><select id="rsm"><option>First</option><option>Second</option></select></div></div><button class="p" onclick="addResult()">Submit for approval</button></div>`):resTable(R);
 else if(r=='HOD')b=tab=='pend'?`<p class="mut">Approving locks the result onto the blockchain automatically.</p>`+resTable(st('Pending'),x=>`<button class="s" onclick="approve(${x.id})">Approve</button> <button class="s" onclick="reject(${x.id})">Reject</button>`):(editId?editV():'')+`<p class="mut">Change a grade if a result was wrong. The Records Unit must approve the change before it counts.</p>`+resTable(st('Compiled'),x=>`<button class="s" onclick="editId=${x.id};render()">Change grade</button>`)+(st('Amended').length?`<h3 style="margin-top:14px">Waiting for Records Unit</h3>`+resTable(st('Amended')):'');
 else if(r=='RecordsUnit')b=tab=='chg'?`<p class="mut">The HOD changed these grades. Approve to lock the new grade onto the blockchain, or reject to restore the original.</p>`+resTable(st('Amended'),x=>`<button class="s" onclick="approveAmend(${x.id})">Approve change</button> <button class="s" onclick="rejectAmend(${x.id})">Reject</button>`):tab=='comp'?resTable(st('Compiled')):`<div class="card"><div class="row"><select id="cs">${DB.students.map(s=>`<option value="${s.id}">${s.matric} ${esc(s.name)}</option>`).join('')}</select><button onclick="issue()">Issue and lock on blockchain</button></div></div><div class="sc"><table><tr><th>ID</th><th>Reg. No.</th><th>Student</th><th>Issued</th><th>Block</th></tr>${DB.certs.map(c=>`<tr><td>CERT-${c.id}</td><td>${stu(c.studentId).matric}</td><td>${esc(stu(c.studentId).name)}</td><td>${c.date}</td><td>${c.blockId}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No certificates issued yet.</td></tr>'}</table></div>`;
 else b=tab=='chain'?(ns=1,chainV()):vlogV();
 return sec(f[1],b,ns)}
async function addResult(){const sc=$('#rsc').value;if(sc===''||sc<0||sc>100){msg='Enter a score between 0 and 100.';return render()}
 const sid=+$('#rs').value,cid=+$('#rc').value;if(!cid||!isReg(sid,cid)){msg='This student has not registered that course, so a result cannot be recorded.';return render()}
 DB.results.push({id:DB.results.length+1,studentId:+$('#rs').value,courseId:+$('#rc').value,score:+sc,grade:gradeOf(+sc),session:$('#rse').value,semester:$('#rsm').value,ts:new Date().toISOString().slice(0,16).replace('T',' '),status:'Pending'});save();msg='Result submitted. It is now waiting for HOD approval.';render()}
async function approve(id){const r=DB.results.find(x=>x.id==id);await commit(r,me.id);save();msg='RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function reject(id){DB.results.find(x=>x.id==id).status='Returned';save();msg='RES-'+id+' returned to the lecturer.';render()}
async function issue(){const c={id:DB.certs.length+1,studentId:+$('#cs').value,date:new Date().toISOString().slice(0,10)};const b=await addBlock(certData(c));c.hash=b.hash;c.blockId=b.id;DB.certs.push(c);save();msg='CERT-'+c.id+' issued and locked in block '+b.id+'.';render()}
async function checkChain(){const bad=[];for(let i=0;i<DB.blocks.length;i++){const b=DB.blocks[i];if(await sha(b.data+b.prev+b.nonce)!==b.hash||(i&&b.prev!==DB.blocks[i-1].hash))bad.push(b.id)}chainMsg={bad,t:bad.length?'Chain broken at block(s) '+bad.join(', ')+'.':'All '+DB.blocks.length+' blocks are linked and intact.'};render()}
function tamper(){const r=DB.results.find(x=>x.status=='Compiled');if(!r)return;r.score=Math.min(100,r.score+10);save();msg='RES-'+r.id+' score changed in the database to '+r.score+'. The blockchain still holds the original.';render()}
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
const audit=(action,r,o,n,reason)=>DB.audit.unshift({at:now(),resId:r.id,reg:stu(r.studentId).matric,action,by:me.name,role:me.role,o,n,reason});
const auditV=()=>`<div class="card"><p class="mut">Every authorised change to an approved result, and who made it.</p><div class="sc"><table><tr><th>When</th><th>Result</th><th>Action</th><th>By</th><th>Change</th><th>Reason</th></tr>${DB.audit.map(a=>`<tr><td>${a.at}</td><td>RES-${a.resId}${a.reg?', '+a.reg:''}</td><td>${a.action}</td><td>${esc(a.by)} (${a.role})</td><td>${a.o.score} (${a.o.grade}) → ${a.n.score} (${a.n.grade})</td><td style="white-space:normal">${esc(a.reason||'')}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">No changes recorded yet.</td></tr>'}</table></div></div>`;
const editV=()=>{const r=DB.results.find(x=>x.id==editId);return`<div class="card"><h3>Change grade for RES-${r.id}</h3><p class="mut">${esc(stu(r.studentId).name)}, ${crs(r.courseId).code}. Current: ${r.score} (${r.grade}).</p><div class="row"><div><label>New score</label><input id="es" type="number" min="0" max="100" value="${r.score}" oninput="$('#eg').value=gradeOf(+this.value)"></div><div><label>New grade</label><select id="eg">${'ABCDEF'.split('').map(g=>`<option ${g==r.grade?'selected':''}>${g}</option>`).join('')}</select></div></div><label>Reason (required)</label><input id="er" placeholder="e.g. Script re-marked after student appeal"><button class="p" onclick="saveEdit()">Save change</button> <button onclick="editId=null;render()">Cancel</button></div>`};
function saveEdit(){const r=DB.results.find(x=>x.id==editId),sc=$('#es').value,g=$('#eg').value,why=$('#er').value.trim();
 if(sc===''||sc<0||sc>100||!why){msg='Enter a score from 0 to 100 and a reason.';return render()}
 if(+sc===r.score&&g===r.grade){msg='Nothing changed. Enter a different score or grade.';return render()}
 const o={score:r.score,grade:r.grade},n={score:+sc,grade:g};
 r.amend={o,n};r.score=n.score;r.grade=n.grade;r.status='Amended';audit('Changed',r,o,n,why);editId=null;save();msg='Change saved for RES-'+r.id+'. It now waits for Records Unit approval.';render()}
async function approveAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;await commit(r,me.id);audit('Re-approved',r,a.o,a.n,'');delete r.amend;save();msg='Change to RES-'+id+' approved and locked in block '+r.blockId+'.';render()}
function rejectAmend(id){const r=DB.results.find(x=>x.id==id),a=r.amend;r.score=a.o.score;r.grade=a.o.grade;r.status='Compiled';audit('Rejected',r,a.n,a.o,'');delete r.amend;save();msg='Change to RES-'+id+' rejected. The original grade is restored.';render()}
const isPaid=id=>DB.payments.some(p=>p.studentId==id&&p.session==SESSION);
const isReg=(sid,cid)=>DB.regs.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==SESSION);
const regCourses=sid=>DB.courses.filter(c=>isReg(sid,c.id));
const hasRes=(sid,cid)=>DB.results.some(r=>r.studentId==sid&&r.courseId==cid&&r.session==SESSION&&r.status!='Returned');
function fillCourses(){const el=$('#rc');if(!el)return;const sid=+$('#rs').value;el.innerHTML=regCourses(sid).filter(c=>!hasRes(sid,c.id)).map(c=>`<option value="${c.id}">${c.code} ${c.title}</option>`).join('')||'<option value="">No registered courses to grade</option>'}
function pay(){DB.payments.push({id:DB.payments.length+1,studentId:me.sid,session:SESSION,amount:FEE,ref:'RCT-'+Math.random().toString(36).slice(2,8).toUpperCase(),at:now()});save();msg='Payment received. You can now register your courses.';render()}
function regC(cid){if(!isPaid(me.sid)){msg='Pay your school fees first.';return render()}if(isReg(me.sid,cid))return render();if(regCourses(me.sid).length>=9){msg='You can register a maximum of 9 courses.';return render()}DB.regs.push({id:DB.regs.length+1,studentId:me.sid,courseId:cid,session:SESSION});save();render()}
function dropC(cid){DB.regs=DB.regs.filter(r=>!(r.studentId==me.sid&&r.courseId==cid&&r.session==SESSION));save();render()}
function printSlip(){try{window.print()}catch(e){msg='Printing is blocked here. Use your browser\'s Print option instead.';render()}}
const carry=sid=>{const o=[];DB.courses.forEach(c=>{const ok=x=>DB.results.filter(r=>r.studentId==sid&&r.courseId==c.id&&r.status=='Compiled'&&x(r));const f=ok(r=>r.session!=SESSION&&r.grade=='F').pop();if(f&&!ok(r=>r.grade!='F').length)o.push({c,r:f})});return o};
const slipHead=t=>{const s=stu(me.sid);return`<div class="slip"><img src="${LOGO}" alt=""><div><b style="font:600 18px Georgia,serif">UNICROSS</b><br>${t}<br><span class="mut">${esc(s.name)}, ${s.matric}, ${s.dept}, ${s.level} level, ${SESSION} session</span></div></div>`};
function studentSec(){const s=stu(me.sid),paid=isPaid(s.id),rc=regCourses(s.id),cy=carry(s.id),pm=DB.payments.find(p=>p.studentId==s.id&&p.session==SESSION);let b='',t='';
 if(tab=='fees'){t='School fees';b=`<div class="card">${paid?`<p><span class="b Compiled">Paid</span> ₦${FEE.toLocaleString()} for ${SESSION}.</p><p class="mut">Receipt ${pm.ref}, ${pm.at}</p>`:`<p><span class="b Pending">Unpaid</span> ₦${FEE.toLocaleString()} for ${SESSION}.</p><p class="mut">Course registration opens after payment.</p><button class="p" onclick="pay()">Pay school fees</button>`}</div>`}
 else if(tab=='reg'){t='Course registration';const u=rc.reduce((a,c)=>a+c.units,0);
  b=!paid?'<div class="card"><p class="mut">Pay your school fees first. Course registration opens after payment.</p></div>':`<div class="card">${slipHead('Course registration form')}<h3>Registered courses (${rc.length} of 9), ${u} units</h3><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Units</th><th>Type</th><th class="noprint"></th></tr>${rc.map(c=>`<tr><td>${c.code}</td><td>${c.title}</td><td>${c.units}</td><td>${cy.some(x=>x.c.id==c.id)?'Carryover':'Regular'}</td><td class="noprint">${hasRes(s.id,c.id)?'<span class="mut">Graded</span>':`<button class="s" onclick="dropC(${c.id})">Drop</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">No courses registered yet.</td></tr>'}</table></div><button class="p noprint" onclick="printSlip()">Print course registration</button></div><div class="card noprint"><h3>Add courses</h3><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Units</th><th></th></tr>${DB.courses.filter(c=>!isReg(s.id,c.id)).map(c=>`<tr><td>${c.code}</td><td>${c.title}</td><td>${c.units}</td><td><button class="s" onclick="regC(${c.id})">Register</button></td></tr>`).join('')||'<tr><td colspan="4" class="mut">All courses registered.</td></tr>'}</table></div></div>`}
 else if(tab=='res'){t='Results';const res=DB.results.filter(r=>r.studentId==s.id&&r.status=='Compiled'),rev=DB.results.filter(r=>r.studentId==s.id&&r.status=='Amended').length;b=`<div class="card">${slipHead('Statement of results')}<div class="sc"><table><tr><th>Result ID</th><th>Course</th><th>Title</th><th>Units</th><th>Score</th><th>Grade</th><th>Session</th><th>Semester</th></tr>${res.map(r=>`<tr><td>RES-${r.id}</td><td>${crs(r.courseId).code}</td><td>${crs(r.courseId).title}</td><td>${crs(r.courseId).units}</td><td>${r.score}</td><td>${r.grade}</td><td>${r.session}</td><td>${r.semester}</td></tr>`).join('')||'<tr><td colspan="8" class="mut">No approved results yet.</td></tr>'}</table></div>${rev?`<p class="mut">${rev} result(s) under review are not shown until approved.</p>`:''}<p class="mut">Employers can verify a result with your registration number and its Result ID.</p><button class="p noprint" onclick="printSlip()">Print results</button></div>`}
 else{t='Carryover courses';b=`<div class="card"><p class="mut">Courses you failed in an earlier session and have not yet passed.</p><div class="sc"><table><tr><th>Code</th><th>Title</th><th>Failed in</th><th>Score</th><th></th></tr>${cy.map(x=>`<tr><td>${x.c.code}</td><td>${x.c.title}</td><td>${x.r.session}</td><td>${x.r.score} (${x.r.grade})</td><td>${isReg(s.id,x.c.id)?'<span class="mut">Registered</span>':paid?`<button class="s" onclick="regC(${x.c.id})">Register</button>`:'<span class="mut">Pay fees first</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">You have no carryover courses.</td></tr>'}</table></div></div>`}
 return sec(t,b)}
function verifyV(){return`<div class="auth" style="max-width:520px"><div class="card"><h2>Verify a result or certificate</h2><p class="mut">Enter the student's registration number and the Result ID (or Certificate ID).</p><label>Your name or organisation</label><input id="vn" placeholder="e.g. Acme Ltd, HR"><label>Registration number</label><input id="vr" placeholder="24/CSC/005" autocapitalize="characters" autocomplete="off"><label>Result ID or Certificate ID</label><input id="vid" placeholder="RES-1" autocapitalize="characters" autocomplete="off"><button class="p" onclick="doVerify()">Verify</button></div>${vres||''}</div>`}
async function doVerify(){const reg=$('#vr').value.trim().toUpperCase(),id=$('#vid').value.trim().toUpperCase().replace(/\s+/g,'').replace(/^(RES|CERT)-?/,'$1-'),who=$('#vn').value.trim()||'Anonymous',st=DB.students.find(x=>x.matric.toUpperCase()==reg);let res='NotFound',rec,data,blk,sum='',re='';
 if(st&&id.startsWith('RES-')){rec=DB.results.find(r=>'RES-'+r.id==id&&r.blockId&&r.studentId==st.id);if(rec){data=recData(rec);sum=`${st.name} (${st.matric}), ${crs(rec.courseId).code} ${crs(rec.courseId).title}: ${rec.score} (${rec.grade}), ${rec.session} ${rec.semester} semester`}}
 else if(st&&id.startsWith('CERT-')){rec=DB.certs.find(c=>'CERT-'+c.id==id&&c.studentId==st.id);if(rec){data=certData(rec);sum=`Certificate for ${st.name} (${st.matric}), issued ${rec.date}`}}
 if(rec){blk=DB.blocks.find(b=>b.id==rec.blockId);re=await sha(data+blk.prev+blk.nonce);const own=await sha(blk.data+blk.prev+blk.nonce);res=re===blk.hash&&own===blk.hash?'Authentic':'Altered'}
 const am=id.startsWith('RES-')&&rec?DB.audit.filter(a=>a.resId==rec.id&&a.action=='Re-approved').length:0;
 DB.log.unshift({id:DB.log.length+1,rec:id||'(empty)',reg:reg||'-',who,at:now(),res});save();
 const say={Authentic:'✅ Authentic. This record matches the blockchain.',Altered:'⚠️ Altered. This record no longer matches what was locked on the blockchain.',NotFound:'❌ Not found. No record matches that registration number and ID.'}[res];
 vres=`<div class="verdict ${res}">${say}</div>`+(blk?`<div class="card"><p>${esc(sum)}</p>${rec.status=='Amended'?'<p class="mut">A grade change on this record is waiting for Records Unit approval.</p>':''}${am?`<p class="mut">This record was changed and re-approved ${am} time(s). Each change is in the audit trail.</p>`:''}<div class="hs"><div><b>Stored on blockchain (block ${blk.id})</b><br><span class="h">${blk.hash}</span></div><div><b>Recalculated from record now</b><br><span class="h" style="color:${res=='Authentic'?'var(--ok)':'var(--bd)'}">${re}</span></div></div></div>`:'');render()}
init();
</script></body></html>
